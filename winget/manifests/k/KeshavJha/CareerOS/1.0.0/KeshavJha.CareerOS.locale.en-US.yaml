ShortDescription: Career workspace for resumes, jobs, interviews, and applications.
Description: >-
  CareerOS is a desktop career workspace for managing resumes, jobs, interview
  preparation, coding practice, and AI-assisted application workflows. This
  desktop build additionally supports local LaTeX resume compilation (bundled
  Tectonic engine, no upload required) and a Coding Arena that runs and
  submits solutions in C, C++, Java, JavaScript, Python, or Rust entirely on
  your machine. An internet connection is required for sign-in and AI
  features.
