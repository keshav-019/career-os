<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerOS Desktop - Loading</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            margin: 0;
            background: #101114;
            color: #f4f7fb;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        .loader {
            text-align: center;
        }

        .brand-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 14px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            margin: 0 auto 20px;
            border: 4px solid rgba(152, 163, 179, 0.22);
            border-top-color: #4f8cff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h2 {
            margin: 0;
            font-weight: 600;
        }

        p {
            margin-top: 8px;
            color: #98a3b3;
        }
    </style>
</head>

<body>
    <div class="loader">
        <img class="brand-logo" src="./logo.png" alt="CareerOS" />
        <div class="spinner"></div>
        <h2>Starting CareerOS</h2>
        <p>Loading your dashboard...</p>
    </div>
</body>

</html>
