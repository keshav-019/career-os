<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerOS - Error</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            margin: 0;
            background: #101114;
            color: #f4f7fb;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        .error {
            max-width: 480px;
            border: 1px solid #303744;
            border-radius: 8px;
            background: #1b1e24;
            padding: 24px;
            text-align: center;
        }

        .brand-logo {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            border-radius: 12px;
        }

        h1 {
            margin: 0;
            color: #f06b7d;
            font-size: 22px;
        }

        p {
            color: #98a3b3;
        }
    </style>
</head>

<body>
    <div class="error">
        <img class="brand-logo" src="./logo.png" alt="CareerOS" />
        <h1>Something went wrong</h1>
        <p>Could not start the CareerOS web application.</p>
        <p>Please try restarting the desktop app.</p>
    </div>
</body>

</html>
