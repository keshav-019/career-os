<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">System Design Interview Category</title>
  <desc id="desc">Illustration of a top-down architecture tree with a client node branching into services and storage.</desc>
  <defs>
    <linearGradient id="sdbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1730"/>
      <stop offset="100%" stop-color="#16305c"/>
    </linearGradient>
    <linearGradient id="sdchip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa6ff"/>
      <stop offset="100%" stop-color="#4f8cff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="620" fill="url(#sdbg)" rx="28"/>

  <g stroke="#3f6099" stroke-width="6" fill="none" opacity="0.9">
    <path d="M600,190 L600,230"/>
    <path d="M600,230 L360,230 L360,270"/>
    <path d="M600,230 L600,270"/>
    <path d="M600,230 L840,230 L840,270"/>
    <path d="M360,330 L360,370"/>
    <path d="M360,370 L230,370 L230,410"/>
    <path d="M360,370 L490,370 L490,410"/>
  </g>

  <g>
    <rect x="500" y="120" width="200" height="70" rx="16" fill="#132749" stroke="#4f8cff" stroke-width="3"/>
    <text x="600" y="163" fill="#eaf1ff" font-size="26" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">Client</text>
  </g>

  <g>
    <rect x="264" y="270" width="192" height="62" rx="14" fill="#122647" stroke="#5aa0e0" stroke-width="2.5"/>
    <text x="360" y="308" fill="#dbe9ff" font-size="21" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">Load Balancer</text>

    <rect x="744" y="270" width="192" height="62" rx="14" fill="#122647" stroke="#5ad6b0" stroke-width="2.5"/>
    <text x="840" y="308" fill="#d8fbee" font-size="21" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">Cache</text>

    <rect x="504" y="270" width="192" height="62" rx="14" fill="#122647" stroke="#c39bff" stroke-width="2.5"/>
    <text x="600" y="308" fill="#eee6ff" font-size="21" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">App Service</text>
  </g>

  <g>
    <rect x="140" y="410" width="180" height="58" rx="13" fill="#0f2038" stroke="#5aa0e0" stroke-width="2"/>
    <text x="230" y="446" fill="#c9ddfb" font-size="19" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">Web Servers</text>

    <rect x="400" y="410" width="180" height="58" rx="13" fill="#0f2038" stroke="#7fd9bd" stroke-width="2"/>
    <text x="490" y="446" fill="#cdf3e5" font-size="19" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">Database</text>
  </g>

  <rect x="820" y="486" width="330" height="56" rx="16" fill="url(#sdchip)" opacity="0.92"/>
  <text x="841" y="522" fill="#041322" font-size="26" font-family="Arial, sans-serif" font-weight="700">System Design</text>
  <text x="822" y="576" fill="#93b6ea" font-size="24" font-family="Arial, sans-serif">Top-down • Drag &amp; drop • Real interviews</text>
</svg>
