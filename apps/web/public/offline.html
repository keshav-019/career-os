<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CareerOS — Offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #101114; color: #f4f6fa; font-family: system-ui, -apple-system, sans-serif; text-align: center; }
  main { max-width: 360px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #9aa1ad; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
  button { background: #3b82f6; color: #fff; border: none; border-radius: 8px; padding: 10px 18px;
           font-size: 14px; font-weight: 700; cursor: pointer; }

<body>
<main>
  <h1>You're offline</h1>
  <p>CareerOS couldn't reach the network. Check your connection and try again.</p>

</html>
