<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Speed Distance Visual</title>
  <desc id="desc">A clean chart-style visual showing distance against time.</desc>
  <rect width="920" height="420" fill="#f7fafc"/>
  <rect x="56" y="36" width="808" height="348" rx="16" fill="#ffffff" stroke="#d0dae7"/>
  <line x1="128" y1="320" x2="812" y2="320" stroke="#63748a" stroke-width="4"/>
  <line x1="128" y1="320" x2="128" y2="88" stroke="#63748a" stroke-width="4"/>
  <polyline points="128,300 250,268 372,230 494,194 616,148 738,112" fill="none" stroke="#2f6fe7" stroke-width="7" stroke-linecap="round"/>
  <circle cx="250" cy="268" r="7" fill="#2f6fe7"/>
  <circle cx="372" cy="230" r="7" fill="#2f6fe7"/>
  <circle cx="494" cy="194" r="7" fill="#2f6fe7"/>
  <circle cx="616" cy="148" r="7" fill="#2f6fe7"/>
  <circle cx="738" cy="112" r="7" fill="#2f6fe7"/>
  <text x="812" y="350" font-size="22" fill="#334155" text-anchor="end">Time</text>
  <text x="74" y="104" font-size="22" fill="#334155" transform="rotate(-90 74 104)">Distance</text>
</svg>
