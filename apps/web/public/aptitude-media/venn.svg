<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Set Theory Venn Visual</title>
  <desc id="desc">Two overlapping circles for set union and intersection representation.</desc>
  <rect width="920" height="420" fill="#f7fafc"/>
  <rect x="56" y="44" width="808" height="332" rx="16" fill="#ffffff" stroke="#d0dae7"/>
  <circle cx="392" cy="210" r="118" fill="#60a5fa" fill-opacity="0.58"/>
  <circle cx="520" cy="210" r="118" fill="#34d399" fill-opacity="0.58"/>
  <text x="340" y="118" font-size="24" fill="#1d4ed8">M</text>
  <text x="570" y="118" font-size="24" fill="#047857">S</text>
  <text x="454" y="216" font-size="22" fill="#0f172a" text-anchor="middle">M and S</text>
  <text x="700" y="170" font-size="22" fill="#334155">Union = M U S</text>
  <text x="700" y="206" font-size="22" fill="#334155">Intersection = M and S</text>
</svg>
