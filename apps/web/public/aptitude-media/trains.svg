<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Trains Visual</title>
  <desc id="desc">Train crossing a pole with distance and time markers.</desc>
  <rect width="920" height="420" fill="#f7fafc"/>
  <rect x="48" y="44" width="824" height="332" rx="16" fill="#ffffff" stroke="#d0dae7"/>
  <line x1="88" y1="312" x2="832" y2="312" stroke="#64748b" stroke-width="10"/>
  <rect x="180" y="210" width="420" height="86" rx="12" fill="#2f6fe7"/>
  <rect x="220" y="182" width="110" height="34" rx="8" fill="#60a5fa"/>
  <rect x="344" y="182" width="110" height="34" rx="8" fill="#60a5fa"/>
  <rect x="468" y="182" width="110" height="34" rx="8" fill="#60a5fa"/>
  <circle cx="262" cy="304" r="19" fill="#0f172a"/>
  <circle cx="505" cy="304" r="19" fill="#0f172a"/>
  <line x1="620" y1="126" x2="620" y2="312" stroke="#ef4444" stroke-width="7"/>
  <polygon points="620,94 640,126 600,126" fill="#ef4444"/>
  <text x="620" y="82" font-size="22" fill="#b91c1c" text-anchor="middle">Pole</text>
  <line x1="180" y1="154" x2="600" y2="154" stroke="#16a34a" stroke-width="5" marker-start="url(#m1)" marker-end="url(#m2)"/>
  <text x="390" y="144" font-size="22" fill="#15803d" text-anchor="middle">Train Length</text>
  <defs>
    <marker id="m1" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8" fill="#16a34a"/>
    </marker>
    <marker id="m2" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
