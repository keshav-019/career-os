<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Number Line Visual</title>
  <desc id="desc">Generic number line with markers for arithmetic reasoning.</desc>
  <rect width="920" height="420" fill="#f7fafc"/>
  <rect x="56" y="44" width="808" height="332" rx="16" fill="#ffffff" stroke="#d0dae7"/>
  <line x1="120" y1="230" x2="800" y2="230" stroke="#475569" stroke-width="5"/>
  <polygon points="800,230 784,222 784,238" fill="#475569"/>
  <g fill="#334155" font-size="18">
    <line x1="180" y1="214" x2="180" y2="246" stroke="#64748b" stroke-width="3"/>
    <text x="170" y="275">-2</text>
    <line x1="300" y1="214" x2="300" y2="246" stroke="#64748b" stroke-width="3"/>
    <text x="292" y="275">0</text>
    <line x1="420" y1="214" x2="420" y2="246" stroke="#64748b" stroke-width="3"/>
    <text x="412" y="275">2</text>
    <line x1="540" y1="214" x2="540" y2="246" stroke="#64748b" stroke-width="3"/>
    <text x="532" y="275">4</text>
    <line x1="660" y1="214" x2="660" y2="246" stroke="#64748b" stroke-width="3"/>
    <text x="652" y="275">6</text>
  </g>
  <text x="120" y="140" font-size="24" fill="#334155">Reasoning Aid: map values before calculation</text>
</svg>
