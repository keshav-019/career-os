id: com.careeros.CareerOS
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: careeros

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20

add-extensions:
  org.freedesktop.Sdk.Extension.texlive:
    directory: texlive
    version: "25.08"
    no-autodownload: false
    autodelete: true

finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --share=network
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --env=ELECTRON_TRASH=gio
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

cleanup-commands:
  - mkdir -p ${FLATPAK_DEST}/texlive

build-options:
  append-path: /usr/lib/sdk/node20/bin
  env:
    NPM_CONFIG_LOGLEVEL: info

modules:
  - name: careeros
    buildsystem: simple
    subdir: main
    build-options:
      env:
        XDG_CACHE_HOME: /run/build/careeros/flatpak-node/cache
        npm_config_cache: /run/build/careeros/flatpak-node/npm-cache
        npm_config_nodedir: /usr/lib/sdk/node20
        npm_config_offline: "true"
        electron_config_cache: /run/build/careeros/flatpak-node/electron-cache
        ELECTRON_CACHE: /run/build/careeros/flatpak-node/electron-cache
    build-commands:
      - npm ci --offline
      - npm run dist:flatpak:dir --workspace careeros-desktop
      - cp -a apps/desktop/dist/linux-unpacked ${FLATPAK_DEST}/careeros
      - install -Dm755 ../careeros-flatpak ${FLATPAK_DEST}/bin/careeros
      - install -Dm755 ../latex/careeros-latex-env ${FLATPAK_DEST}/share/careeros/latex/careeros-latex-env
      - install -Dm644 ../com.careeros.CareerOS.desktop ${FLATPAK_DEST}/share/applications/com.careeros.CareerOS.desktop
      - install -Dm644 ../com.careeros.CareerOS.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.careeros.CareerOS.metainfo.xml
      - install -Dm644 apps/desktop/build/icon.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/com.careeros.CareerOS.png
    sources:
      - type: dir
        path: ../..
        dest: main
        skip:
          - .git
          - node_modules
          - apps/desktop/dist
          - apps/desktop/vendor/latex
          - dist
      - generated-sources.json
      - type: file
        url: https://github.com/electron/electron/releases/download/v31.7.7/electron-v31.7.7-linux-x64.zip
        sha256: 00a2e8e5f52fe39c37cfc9d7bd7629e560017d28ee94c51495bf7e39c84b2d47
        dest: flatpak-node/electron-cache
      - type: file
        path: careeros-flatpak
      - type: file
        path: latex/careeros-latex-env
      - type: file
        path: com.careeros.CareerOS.desktop
      - type: file
        path: com.careeros.CareerOS.metainfo.xml
